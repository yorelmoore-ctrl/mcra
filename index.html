<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evidence I Exist</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#a688d4">

  <script defer src="script.js"></script>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="journal">Journal</button>
    <button class="tab" data-tab="archive">Archive</button>
    <button class="tab" data-tab="room">Room</button>
    <button class="tab" data-tab="stats">Stats</button>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HOME -->
    <section class="section active" data-section="home">
      <h1>Welcome</h1>

      <div class="card">
        <p id="aiPrompt"></p>
        <button id="newPrompt">New Reflection</button>
      </div>

      <div class="card">
        <button id="streakBtn">Log Today</button>
        <p id="streakDisplay"></p>
      </div>
    </section>

    <!-- JOURNAL -->
    <section class="section" data-section="journal">

      <h1>Journal</h1>

      <textarea id="entry" placeholder="write what you feel..."></textarea>
      <button id="saveEntry">Save</button>

    </section>

    <!-- ARCHIVE -->
    <section class="section" data-section="archive">
      <h1>Archive</h1>
      <div id="archiveList"></div>
    </section>

    <!-- ROOM -->
    <section class="section" data-section="room">
      <h1>Room</h1>

      <div class="room">
        <div class="item" data-mood="calm">🛏️ Bed</div>
        <div class="item" data-mood="soft">🪞 Mirror</div>
        <div class="item" data-mood="bright">🌙 Light</div>
      </div>

      <p id="roomText"></p>
    </section>

    <!-- STATS -->
    <section class="section" data-section="stats">

      <h1>Stats</h1>

      <label>Energy</label>
      <input type="range" id="energy" min="0" max="100">

      <label>Emotional HP</label>
      <input type="range" id="hp" min="0" max="100">

      <label>Social Battery</label>
      <input type="range" id="social" min="0" max="100">

    </section>

  </main>

</div>

</body>
</html>
