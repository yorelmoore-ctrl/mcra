<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evidence I Exist</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c3a4ff">

  <script defer src="script.js"></script>
</head>

<body>

<canvas id="stars"></canvas>
<div class="moon"></div>

<div class="app">

  <main class="main">

    <!-- HOME -->
    <section class="section active" data-section="home">

      <h1>Welcome</h1>

      <div class="card">
        <p id="aiPrompt"></p>
        <button id="newPrompt">New Reflection</button>
      </div>

      <div class="card">
        <button id="streakBtn">Log Today</button>
        <p id="streakDisplay"></p>
      </div>

    </section>

    <!-- JOURNAL -->
    <section class="section" data-section="journal">

      <div id="journalCover" class="book">
        <h2>📖 Journal</h2>
        <p>Your private space</p>
        <button id="openJournal">Open Journal</button>
      </div>

      <div id="journalWrite" class="hidden">
        <textarea id="entry" placeholder="write what you feel..."></textarea>
        <button id="saveEntry">Save Entry</button>
      </div>

    </section>

    <!-- ARCHIVE -->
    <section class="section" data-section="archive">
      <h1>Archive</h1>
      <div id="archiveList"></div>
    </section>

    <!-- ROOM -->
    <section class="section" data-section="room">
      <h1>Room</h1>

      <div class="room">
        <div class="item" data-mood="sunset">🌅 Sunset</div>
        <div class="item" data-mood="dusk">🌙 Dusk</div>
        <div class="item" data-mood="dream">✨ Dream</div>
      </div>

      <p id="roomText"></p>
    </section>

    <!-- STATS -->
    <section class="section" data-section="stats">

      <h1>Stats</h1>

      <label>Energy</label>
      <input type="range" id="energy">

      <label>Emotional HP</label>
      <input type="range" id="hp">

      <label>Social Battery</label>
      <input type="range" id="social">

    </section>

  </main>

</div>

<!-- 🌙 BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="tab active" data-tab="home">🏠</button>
  <button class="tab" data-tab="journal">📖</button>
  <button class="tab" data-tab="archive">📚</button>
  <button class="tab" data-tab="room">🌙</button>
  <button class="tab" data-tab="stats">📊</button>
</nav>

</body>
</html>
