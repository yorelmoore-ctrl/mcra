<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MCRA Journal</title>

  <link rel="stylesheet" href="style.css"/>
  <script defer src="script.js"></script>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2 class="logo">MCRA</h2>

      <button class="tab active" data-tab="home">Home</button>
      <button class="tab" data-tab="archive">Archive</button>
      <button class="tab" data-tab="room">Virtual Room</button>
      <button class="tab" data-tab="stats">Stats</button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- HOME -->
      <section class="section active" data-section="home">
        <h1>Welcome Back</h1>
        <p>Your recovery arc continues here.</p>
      </section>

      <!-- ARCHIVE -->
      <section class="section" data-section="archive">
        <h1>Archive</h1>
        <p>Saved entries will appear here.</p>
      </section>

      <!-- VIRTUAL ROOM -->
      <section class="section" data-section="room">
        <h1>Virtual Room</h1>
        <div class="room">
          <div class="item">🛏️ Bed</div>
          <div class="item">🪞 Mirror</div>
          <div class="item">🌙 Mood Light</div>
        </div>
      </section>

      <!-- STATS -->
      <section class="section" data-section="stats">
        <h1>Recovery Stats</h1>

        <div class="stat">
          Energy
          <input type="range" min="0" max="100" value="50">
        </div>

        <div class="stat">
          Emotional HP
          <input type="range" min="0" max="100" value="70">
        </div>

        <div class="stat">
          Social Battery
          <input type="range" min="0" max="100" value="40">
        </div>
      </section>

    </main>

  </div>

</body>
</html>
